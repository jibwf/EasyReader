name: Build Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute app version
        id: appver
        shell: bash
        run: |
          today=$(TZ=Asia/Shanghai date +%Y%m%d)
          count=$(git rev-list --count --since="${today} 00:00:00 +0800" --until="${today} 23:59:59 +0800" HEAD)
          version="${today}${count}"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Computed app version: ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-9cm7y3ffjbrojvtk.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crpi-9cm7y3ffjbrojvtk.cn-beijing.personal.cr.aliyuncs.com/jibwf/easyreader
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.appver.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
